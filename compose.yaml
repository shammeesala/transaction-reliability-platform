services:
  postgres:
    image: postgres:16-alpine
    container_name: transaction-platform-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: transaction_platform
      POSTGRES_USER: platform_user
      POSTGRES_PASSWORD: platform_pass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_user -d transaction_platform"]
      interval: 3s
      timeout: 3s
      retries: 5
